limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=csrf_limit:1m rate=5r/s;

server {
    listen 8000;
    listen 80;
    server_name _;

    server_tokens off;

    client_max_body_size 20m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;

    fastcgi_read_timeout 300;
    fastcgi_buffering off;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    # Security headers (API is public-facing via Cloudflare Tunnel)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    root /app/public;
    index index.php;

    # Block sensitive files (defense-in-depth beyond Laravel's .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~* ^/(composer\.(json|lock|phar)|readme\.md|license.*|\.env.*|\.git.*|\.env\.example) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /sanctum/csrf-cookie {
        limit_req zone=csrf_limit burst=10 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /sanctum/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass aiplanstudio_apifpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO "https";
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }
}
