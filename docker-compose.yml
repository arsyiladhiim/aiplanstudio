services:
  nginx:
    image: nginx:alpine
    ports:
      - "4197:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/storage/logs:/var/log/nginx:rw
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    networks: [aiplanstudio]
    mem_limit: 128m
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    expose: ["3000"]
    environment:
      - LARAVEL_URL=http://api:8000
      - SENTRY_DSN=${SENTRY_FRONTEND_DSN:-}
      - NEXT_PUBLIC_SENTRY_DSN=${SENTRY_FRONTEND_PUBLIC_DSN:-}
    depends_on:
      - api
    networks: [aiplanstudio]
    mem_limit: 512m
    restart: unless-stopped

  # Laravel via php-fpm; nginx `api` adalah front HTTP-nya
  api:
    image: nginx:alpine
    expose: ["8000"]
    volumes:
      - ./docker/api-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/public:/app/public:ro
    depends_on:
      - api-fpm
    networks: [aiplanstudio]
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-fpm:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: aiplanstudio-api
    expose: ["9000"]
    environment:
      - SENTRY_LARAVEL_DSN=${SENTRY_BACKEND_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-local}
    # NB: jangan gunakan env_file: ./api/.env — Laravel membaca .env sendiri.
    # Mengekspor DB_* sebagai real env membuat PHPUnit (12) tidak bisa
    # meng-override-nya untuk DB test (force= di PHPUnit sudah dihapus) sehingga
    # `php artisan test` bisa menimpa DB utama (aiplanstudio) via migrate:fresh.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [aiplanstudio]
    working_dir: /app
    volumes:
      - ./api:/app
    mem_limit: 256m
    restart: unless-stopped

  # One-shot: jalankan migrasi sebelum api-fpm mulai
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: aiplanstudio-api
    depends_on:
      db:
        condition: service_healthy
    networks: [aiplanstudio]
    working_dir: /app
    volumes:
      - ./api:/app
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/postgres/data_:/var/lib/postgresql/data
    networks: [aiplanstudio]
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./docker/redis/data:/data
    expose: ["6379"]
    networks: [aiplanstudio]
    mem_limit: 64m
    restart: unless-stopped

  glitchtip:
    image: glitchtip/glitchtip:6
    expose: ["8000"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/glitchtip
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://glitchtip:8000
      DEFAULT_FROM_EMAIL: glitchtip@localhost
      SERVER_ROLE: all_in_one
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./docker/glitchtip/uploads:/code/uploads
    networks: [aiplanstudio]
    mem_limit: 256m
    restart: unless-stopped

networks:
  aiplanstudio:
    driver: bridge
