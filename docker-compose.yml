services:
  nginx:
    image: nginx:alpine
    ports:
      - "4197:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/storage/logs:/var/log/nginx:rw
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    networks: [aiplanstudio]
    mem_limit: 128m
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    expose: ["3000"]
    environment:
      - LARAVEL_URL=http://api:8000
    depends_on:
      - api
    networks: [aiplanstudio]
    mem_limit: 512m
    restart: unless-stopped

  # Laravel via php-fpm; nginx `api` adalah front HTTP-nya
  api:
    image: nginx:alpine
    expose: ["8000"]
    volumes:
      - ./docker/api-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/public:/app/public:ro
    depends_on:
      - api-fpm
    networks: [aiplanstudio]
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-fpm:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: aiplanstudio-api
    expose: ["9000"]
    env_file: ./api/.env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [aiplanstudio]
    working_dir: /app
    volumes:
      - ./api:/app
    mem_limit: 256m
    restart: unless-stopped

  # One-shot: jalankan migrasi sebelum api-fpm mulai
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: aiplanstudio-api
    env_file: ./api/.env
    depends_on:
      db:
        condition: service_healthy
    networks: [aiplanstudio]
    working_dir: /app
    volumes:
      - ./api:/app
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/postgres/data_:/var/lib/postgresql/data
    networks: [aiplanstudio]
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./docker/redis/data:/data
    expose: ["6379"]
    networks: [aiplanstudio]
    mem_limit: 64m
    restart: unless-stopped

networks:
  aiplanstudio:
    driver: bridge
