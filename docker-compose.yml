services:
  aiplanstudionginx_web:
    image: nginx:alpine
    container_name: aiplanstudionginx_web
    ports:
      - "4197:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/storage/logs:/var/log/nginx:rw
    depends_on:
      aiplanstudio_web:
        condition: service_healthy
      aiplanstudionginx_api:
        condition: service_healthy
    networks: [aiplanstudio, cloudflare_tunnel_default]
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  aiplanstudio_web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # NEXT_PUBLIC_SENTRY_DSN DISABLED (GlitchTip mati) — aktifkan lagi bila dibutuhkan
      # args:
      #   - NEXT_PUBLIC_SENTRY_DSN=${SENTRY_FRONTEND_PUBLIC_DSN:-}
    container_name: aiplanstudio_web
    expose: ["3000"]
    environment:
      - LARAVEL_URL=http://aiplanstudionginx_api:8000
      # - SENTRY_DSN=${SENTRY_FRONTEND_DSN:-}
      # - NEXT_PUBLIC_SENTRY_DSN=${SENTRY_FRONTEND_PUBLIC_DSN:-}
      - HOSTNAME=0.0.0.0
    depends_on:
      aiplanstudionginx_api:
        condition: service_healthy
    networks: [aiplanstudio]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  aiplanstudionginx_api:
    image: nginx:alpine
    container_name: aiplanstudionginx_api
    expose: ["8000"]
    volumes:
      - ./docker/api-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/public:/app/public:ro
    depends_on:
      aiplanstudio_apifpm:
        condition: service_healthy
    networks:
      - aiplanstudio
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  aiplanstudio_apifpm:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: aiplanstudio_apifpm
    image: aiplanstudio-api
    expose: ["9000"]
    environment:
      # SENTRY DISABLED (GlitchTip mati) — aktifkan lagi bila dibutuhkan
      # - SENTRY_LARAVEL_DSN=${SENTRY_BACKEND_DSN:-}
      # - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-local}
      - HOSTNAME=0.0.0.0
    depends_on:
      aiplanstudio_db:
        condition: service_healthy
    networks:
      - aiplanstudio
    working_dir: /app
    volumes:
      - ./api:/app
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  aiplanstudio_db:
    image: postgres:16-alpine
    container_name: aiplanstudio_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/postgres/data_:/var/lib/postgresql/data
    networks:
      - aiplanstudio
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  aiplanstudio_redis:
    image: redis:alpine
    container_name: aiplanstudio_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./docker/redis/data:/data
    expose: ["6379"]
    networks:
      - aiplanstudio
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================
