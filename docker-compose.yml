services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/storage/logs:/var/log/nginx:rw
    depends_on: [web, api]
    networks: [aistack]
    mem_limit: 128m
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    expose: ["3000"]
    environment:
      - LARAVEL_URL=http://api:8000
    networks: [aistack]
    mem_limit: 756m
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: aistack-api
    expose: ["8000"]
    env_file: ./api/.env
    depends_on: [db]
    networks: [aistack]
    restart: unless-stopped
    working_dir: /app
    entrypoint: []
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    volumes:
      - ./api:/app
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aistack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/postgres/data_:/var/lib/postgresql/data
    networks: [aistack]
    mem_limit: 128m
    restart: unless-stopped

  redis:
    image: redis:alpine
    command: ["redis-server", "--requirepass", "aistack_redis_2024"]
    volumes:
      - ./docker/redis/data:/data
    expose: ["6379"]
    networks: [aistack]
    mem_limit: 64m
    restart: unless-stopped

networks:
  aistack:
    driver: bridge
